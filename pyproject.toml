[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moview"
version = "0.1.0"
description = "Molecular orbital wavefunction parser and OpenGL isosurface viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-image",
]

[project.optional-dependencies]
gui = [
    "PyQt6",
    "PyOpenGL",
    "pyqtgraph",
]

[project.scripts]
moview = "moview.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
