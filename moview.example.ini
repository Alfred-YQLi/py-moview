; MOview configuration template. Copy to moview.ini and adjust for your machine.
; Explicit command-line arguments override matching values below.

[resources]
; Threads used while constructing a cached BasisGrid.
basis_workers = 12
; Concurrent background pre-render batches. Keep at 1 on memory-limited systems.
background_jobs = 1
; Memory limits are in MiB.
basis_cache_mib = 768
max_basis_cache_entry_mib = 640
render_cache_mib = 512
render_cache_entries = 240
prefetch_field_budget_mib = 192
max_prefetch_orbitals = 48
; Temporary grid-evaluation chunk size and maximum OpenGL surface faces.
grid_chunk_points = 262144
surface_face_limit = 160000

[render]
grid = 81
margin_bohr = 4.0
isovalue = 0.05
surface_style = glass
atom_style = ball_stick
atom_scale = 1.0
label_mode = off
; Attached is depth-tested 3D placement; Floating avoids overlaps in screen space.
label_placement = attached
label_size = 12
positive_color = Red
negative_color = Blue

[view]
zoom = 1.0
sync_views = true
show_axes = true
auto_render = true

[colors]
; Modify a preset or add a new line using: Name = R, G, B
Red = 239, 59, 44
Blue = 37, 99, 235
Violet = 139, 92, 246
Cyan = 6, 182, 212
Orange = 249, 115, 22
Green = 34, 197, 94
Magenta = 236, 72, 153
Gold = 234, 179, 8
Teal = 20, 184, 166
